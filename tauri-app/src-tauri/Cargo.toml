[package]
name = "btc-crm"
version = "1.0.0"
description = "BTC CRM desktop shell"
authors = ["Big Techno Club"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
strip = true
